<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: Arial, sans-serif; margin: 30px auto; max-width: 850px; padding: 0 15px; }
      .form-group { margin-bottom: 20px; }
      label { display: block; margin-bottom: 5px; font-weight: bold; }
      select, textarea, input[type="number"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
      button { padding: 10px 20px; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
      .btn-primary { background-color: #1a73e8; }
      .btn-primary:hover { background-color: #1557b0; }
      .btn-success { background-color: #28a745; }
      .btn-info { background-color: #17a2b8; }
      .btn-warning { background-color: #fd7e14; }
      .button-row { display: flex; gap: 10px; margin-top: 10px; }
      .button-row button { flex: 1; }
      #message { margin-top: 15px; font-weight: bold; text-align: center; }
      hr { margin: 40px 0; border: 0; border-top: 1px solid #eee; }
      .table-responsive { overflow-x: auto; margin-top: 15px; }
      table { width: 100%; border-collapse: collapse; white-space: nowrap; }
      th, td { padding: 8px 12px; border: 1px solid #ddd; text-align: left; }
      th { background-color: #f8f9fa; }
      .text-center { text-align: center; }
      .text-bold { font-weight: bold; }
      .rank-1 { background-color: #fff3cd; font-weight: bold; }
      .rank-2 { background-color: #e2e3e5; }
      .rank-3 { background-color: #f8d7da; }
      
      /* Editable mark styles */
      .editable-mark { cursor: pointer; color: #1a73e8; transition: background-color 0.2s; }
      .editable-mark:hover { background-color: #e8f0fe; text-decoration: underline; }
      .edit-hint { font-size: 0.85em; color: #666; margin-top: 5px; text-align: right; }
      
      /* Performance breakdown styling */
      .perf-box { margin-bottom: 20px; border-radius: 6px; padding: 15px; border: 1px solid #ddd; }
      .perf-low { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
      .perf-mid { background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
      .perf-high { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
      .perf-title { font-size: 1.1em; font-weight: bold; margin-bottom: 8px; }

      @media (max-width: 500px) { .button-row { flex-direction: column; } }
      @media print {
  body * {
    visibility: hidden;
  }
  #reportResults, #reportResults * {
    visibility: visible;
  }
  #reportResults {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 15px;
  }
  .navbar, button, .form-group {
    display: none !important;
  }
}
    </style>
  </head>
  <body>
    
    <h2>Submit Student Marks</h2>
    <a href="progress_report.html" 
     class="btn-link" 
     rel="noopener noreferrer" 
     title="View Student Progress Report">
     📊 View Student Progress Report
  </a>
    <form id="marksForm" onsubmit="event.preventDefault(); submitData();">
      <div class="form-group">
        <label for="spreadsheetId">Select File (Exam):</label>
        <select id="spreadsheetId" name="spreadsheetId" required>
          <option value="">-- Loading your Google Sheets... --</option>
        </select>
      </div>

      <div class="form-group">
        <label for="className">Class:</label>
        <select id="className" name="className" required>
          <option value="">-- Select Class --</option>
          <option value="S2A">S2A</option>
          <option value="S2B">S2B</option>
          <option value="C2A">C2A</option>
          <option value="C2B">C2B</option>
          <option value="S1A">S1A</option>
          <option value="S1B">S1B</option>
          <option value="C1A">C1A</option>
          <option value="C1B">C1B</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="subject">Subject:</label>
        <select id="subject" name="subject" required>
          <option value="">-- Select Subject --</option>
          <option value="ENG">English (Eng)</option>
          <option value="LANG">Sec Lang (Lang)</option>
          <option value="PHY">Physics (Phy)</option>
          <option value="CHE">Chemistry (Che)</option>
          <option value="MATHS">Mathematics (Maths)</option>
          <option value="BIO">Biology (Bio)</option>
          <option value="COMP">Computer Science (CS)</option>
          <option value="COMP">Computer Comm(Comp)</option>
          <option value="ECO">Economics (Eco)</option>
          <option value="BS">Business Studies (BS)</option>
          <option value="ACC">Accountancy (Acc)</option>
          <option value="POL">Political Science (Pol)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label for="marks">Upload Marks:</label>
        <textarea id="marks" name="marks" rows="6" required></textarea>
      </div>
      
      <button type="submit" id="submitBtn" class="btn-primary">Submit Marks</button>
    </form>
    
    <div id="message"></div>

    <hr>  
    <button type="button" class="btn-danger" onclick="window.print()">📄 Print / Save as PDF</button>
    <!-- REPORTS SECTION -->
    <h2>Class Reports & Analytics</h2>
    <div class="form-group">
      <label for="reportSpreadsheetId">Select File (Exam):</label>
      <select id="reportSpreadsheetId">
        <option value="">-- Loading your Google Sheets... --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="reportClass">Select Class:</label>
      <select id="reportClass">
        <option value="">-- Select Class --</option>
        <option value="S2A">S2A</option>
        <option value="S2B">S2B</option>
        <option value="C2A">C2A</option>
        <option value="C2B">C2B</option>
        <option value="S1A">S1A</option>
        <option value="S1B">S1B</option>
        <option value="C1A">C1A</option>
        <option value="C1B">C1B</option>
      </select>
    </div>

    <div class="form-group">
      <label for="maxMarks">Maximum Marks (For Subject Performance Analysis):</label>
      <input type="number" id="maxMarks" value="100" min="1" placeholder="e.g. 100, 80, 50">
    </div>

    <div class="form-group">
      <label for="reportSubject">Select Subject (Required for Performance Analysis):</label>
      <select id="reportSubject">
        <option value="">-- Select Subject --</option>
        <option value="ENG">English (Eng)</option>
        <option value="LANG">Sec Lang (Lang)</option>
        <option value="PHY">Physics (Phy)</option>
        <option value="CHE">Chemistry (Che)</option>
        <option value="MATHS">Mathematics (Maths)</option>
        <option value="BIO">Biology (Bio)</option>
        <option value="COMP">Computer Science (CS)</option>
        <option value="COMP">Computer Comm(Comp)</option>
        <option value="ECO">Economics (Eco)</option>
        <option value="BS">Business Studies (BS)</option>
        <option value="ACC">Accountancy (Acc)</option>
        <option value="POL">Political Science (Pol)</option>
      </select>
    </div>

    <div id="reportResults"></div>
    
    <div class="button-row">
      <button type="button" class="btn-success" onclick="fetchRanks()">🏆 Top 3 Ranks</button>
      <button type="button" class="btn-info" onclick="fetchAllMarks()">📊 View Marks (Rank Wise)</button>
      <button type="button" class="btn-warning" onclick="fetchPerformance()">📈 Subject Breakdown</button>
      <!-- Button 2: Sheet Order / Unsorted -->
        <button class="btn-info" onclick="fetchAllMarks2()">View Marks (Roll No Wise)</button>
    </div>
    
    

    <script>
      window.onload = function() {
        google.script.run.withSuccessHandler(function(files) {
          var options = '<option value="">-- Select a Spreadsheet --</option>';
          files.forEach(function(file) {
            options += '<option value="' + file.id + '">' + file.name + '</option>';
          });
          document.getElementById('spreadsheetId').innerHTML = options;
          document.getElementById('reportSpreadsheetId').innerHTML = options;
        }).getSpreadsheets();
      };

      function submitData() {
        var btn = document.getElementById('submitBtn');
        var msg = document.getElementById('message');
        btn.disabled = true; btn.innerText = 'Submitting...'; msg.innerText = '';

        google.script.run
          .withSuccessHandler(function(response) {
            msg.innerText = response;
            if(response.startsWith("Success")) {
               msg.style.color = "green";
               document.getElementById('marks').value = "";
            } else { msg.style.color = "red"; }
            btn.disabled = false; btn.innerText = 'Submit Marks';
          })
          .submitMarks(document.getElementById('marksForm'));
      }

      function fetchRanks() {
        var fileId = document.getElementById('reportSpreadsheetId').value;
        var className = document.getElementById('reportClass').value;
        var resultsDiv = document.getElementById('reportResults');
        
        if (!fileId || !className) {
          resultsDiv.innerHTML = '<p style="color: red; text-align:center;">Select both File and Class.</p>';
          return;
        }
        
        resultsDiv.innerHTML = '<p style="text-align:center;"><i>Calculating ranks...</i></p>';
        google.script.run.withSuccessHandler(function(response) {
            if (response.error) { resultsDiv.innerHTML = '<span style="color:red">' + response.error + '</span>'; } 
            else if (response.data.length === 0) { resultsDiv.innerHTML = '<p>No marks recorded.</p>'; } 
            else {
              var html = '<div class="table-responsive"><table><tr><th class="text-center">Rank</th><th>Name</th><th class="text-center">Total</th></tr>';
              response.data.forEach(function(s) {
                var rowClass = s.rank <= 3 ? 'rank-' + s.rank : '';
                html += '<tr class="' + rowClass + '"><td class="text-center text-bold">' + s.rank + '</td><td>' + s.name + '</td><td class="text-center text-bold">' + s.total + '</td></tr>';
              });
              html += '</table></div>';
              resultsDiv.innerHTML = html;
            }
          }).getTopRanks(fileId, className);
      }
      function fetchAllMarks() {
  var fileId = document.getElementById('reportSpreadsheetId').value;
  var className = document.getElementById('reportClass').value;
  var resultsDiv = document.getElementById('reportResults');
  
  if (!fileId || !className) {
    resultsDiv.innerHTML = '<p style="color: red; text-align:center;">Select both File and Class.</p>';
    return;
  }
  
  resultsDiv.innerHTML = '<p style="text-align:center;"><i>Fetching student marks sorted by Falls No...</i></p>';
  
  google.script.run.withSuccessHandler(function(response) {
      if (response.error) { 
        resultsDiv.innerHTML = '<span style="color:red">' + response.error + '</span>'; 
      } 
      else if (response.students.length === 0) { 
        resultsDiv.innerHTML = '<p>No marks recorded.</p>'; 
      } 
      else {
        var html = '<div class="edit-hint">💡 <i>Click any mark value to edit it directly!</i></div>';
        html += '<div class="table-responsive"><table><tr>';
        
        // Render headers (Includes Falls No., Roll No., Student Name, Subjects, Total)
        response.headers.forEach(function(h) { 
          html += '<th>' + h + '</th>'; 
        });
        html += '</tr>';
        
        // Render student rows
        response.students.forEach(function(s) {
          html += '<tr>';
          html += '<td class="text-center text-bold">' + (s.fallsNo !== "" ? s.fallsNo : "-") + '</td>';
          html += '<td class="text-center">' + (s.rollNo !== "" ? s.rollNo : "-") + '</td>';
          html += '<td>' + s.name + '</td>';
          
          s.marks.forEach(function(m) {
            var displayMark = (m.value !== "" && m.value !== null && m.value !== undefined) ? m.value : "-";
            html += '<td class="text-center editable-mark" title="Click to edit" onclick="editCellMark(this, \'' + fileId + '\', \'' + className + '\', ' + m.rowIndex + ', ' + m.colIndex + ', \'' + (m.value || '') + '\')">' + displayMark + ' ✏️</td>';
          });
          
          html += '<td class="text-center text-bold" style="background-color: #e9ecef;">' + s.total + '</td>';
          html += '</tr>';
        });
        
        html += '</table></div>';
        resultsDiv.innerHTML = html;
      }
    }).getAllStudentsMarks(fileId, className);
}
      

      function fetchAllMarks2() {
  var fileId = document.getElementById('reportSpreadsheetId').value;
  var className = document.getElementById('reportClass').value;
  var resultsDiv = document.getElementById('reportResults');
  
  if (!fileId || !className) {
    resultsDiv.innerHTML = '<p style="color: red; text-align:center;">Select both File and Class.</p>';
    return;
  }
  
  resultsDiv.innerHTML = '<p style="text-align:center;"><i>Fetching student marks sorted by Roll No...</i></p>';
  
  google.script.run.withSuccessHandler(function(response) {
      if (response.error) { 
        resultsDiv.innerHTML = '<span style="color:red">' + response.error + '</span>'; 
      } 
      else if (response.students.length === 0) { 
        resultsDiv.innerHTML = '<p>No marks recorded.</p>'; 
      } 
      else {
       // var html = '<div class="edit-hint">💡 <i>Click any mark value to edit it directly!</i></div>';
        var html =  '<div class="table-responsive"><table><tr>';
        
        // Render headers (including Roll No.)
        response.headers.forEach(function(h) { 
          html += '<th>' + h + '</th>'; 
        });
        html += '</tr>';
        
        // Render student rows
        response.students.forEach(function(s) {
          html += '<tr>';         
          html += '<td class="text-center text-bold">' + (s.rollNo !== "" ? s.rollNo : "-") + '</td>';
          html += '<td>' + s.name + '</td>';
          
          s.marks.forEach(function(m) {
            var displayMark = (m.value !== "" && m.value !== null && m.value !== undefined) ? m.value : "-";
            html += '<td class="text-center">' + displayMark + '</td>';
          });
          
          html += '<td class="text-center text-bold" style="background-color: #e9ecef;">' + s.total + '</td>';
          html += '</tr>';
        });
        
        html += '</table></div>';
        resultsDiv.innerHTML = html;
      }
    }).getAllStudentsMarks_2(fileId, className);
}
      function editCellMark(cellElement, fileId, sheetName, rowIndex, colIndex, currentValue) {
        var newMark = prompt("Enter new mark for this student:", currentValue);
        if (newMark === null) return;

        var oldText = cellElement.innerText;
        cellElement.innerText = "⏳...";

        google.script.run
          .withSuccessHandler(function(response) {
            if (response.startsWith("Success")) {
              fetchAllMarks();
            } else {
              alert(response);
              cellElement.innerText = oldText;
            }
          })
          .updateCellMark(fileId, sheetName, rowIndex, colIndex, newMark);
      }

      function fetchPerformance() {
        var fileId = document.getElementById('reportSpreadsheetId').value;
        var className = document.getElementById('reportClass').value;
        var subject = document.getElementById('reportSubject').value;
        var maxMarks = parseFloat(document.getElementById('maxMarks').value);
        var resultsDiv = document.getElementById('reportResults');

        if (!fileId || !className || !subject || isNaN(maxMarks) || maxMarks <= 0) {
          resultsDiv.innerHTML = '<p style="color: red; text-align:center;">Please select File, Class, Subject, and enter a valid Max Mark.</p>';
          return;
        }

        resultsDiv.innerHTML = '<p style="text-align:center;"><i>Analyzing subject performance...</i></p>';

        google.script.run.withSuccessHandler(function(response) {
          if (response.error) {
            resultsDiv.innerHTML = '<span style="color:red">' + response.error + '</span>';
            return;
          }

          var buildTable = function(studentList) {
            if (studentList.length === 0) return '<p><i>No students in this range.</i></p>';
            var html = '<table style="margin-top: 8px;"><tr><th>Student Name</th><th class="text-center">Mark</th><th class="text-center">Percentage</th></tr>';
            studentList.forEach(function(st) {
              html += '<tr><td>' + st.name + '</td><td class="text-center">' + st.mark + ' / ' + maxMarks + '</td><td class="text-center text-bold">' + st.percentage + '%</td></tr>';
            });
            html += '</table>';
            return html;
          };

          var html = '<h3 style="text-align:center;">Performance Breakdown for ' + subject + ' (Max Score: ' + maxMarks + ')</h3>';
          
          // High Performers
          html += '<div class="perf-box perf-high">';
          html += '<div class="perf-title">🌟 High Performers (≥ 90%) — Count: ' + response.high.length + '</div>';
          html += buildTable(response.high);
          html += '</div>';

          // Average Performers
          html += '<div class="perf-box perf-mid">';
          html += '<div class="perf-title">📈 Average / Good Performers (31% – 89%) — Count: ' + response.mid.length + '</div>';
          html += buildTable(response.mid);
          html += '</div>';

          // Needs Improvement
          html += '<div class="perf-box perf-low">';
          html += '<div class="perf-title">⚠️ Needs Attention (≤ 30%) — Count: ' + response.low.length + '</div>';
          html += buildTable(response.low);
          html += '</div>';

          resultsDiv.innerHTML = html;
        }).getSubjectPerformance(fileId, className, subject, maxMarks);
      }
      
     
    </script>
  </body>
</html>
